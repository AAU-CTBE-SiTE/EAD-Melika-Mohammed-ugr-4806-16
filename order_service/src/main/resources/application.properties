spring.application.name=order_service

# order_service runs on 9090 (customer_service calls it with RestClient)
server.port=9090

# ---------- MongoDB ----------
# The database "order_db" is created automatically on the first save
# Spring Boot 3.x reads this line:
spring.data.mongodb.uri=mongodb://localhost:27017/order_db
# Spring Boot 4.x reads this line instead (keeping both is harmless):
spring.mongodb.uri=mongodb://localhost:27017/order_db
