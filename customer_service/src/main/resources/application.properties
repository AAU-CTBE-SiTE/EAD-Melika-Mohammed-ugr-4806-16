spring.application.name=customer_service

# customer_service runs on 8080 (order_service is on 9090)
server.port=8080

# ---------- MySQL ----------
# The database "customer_db" is created automatically if it doesn't exist
spring.datasource.url=jdbc:mysql://localhost:3306/customer_db?createDatabaseIfNotExist=true
spring.datasource.username=root
# change this to YOUR MySQL password
spring.datasource.password=Melikasis2@

# creates/updates the "customers" table from the Customer entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# show the error message (e.g. "Customer not found") in Postman
server.error.include-message=always
